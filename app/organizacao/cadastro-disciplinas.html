<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b2147">
  <meta name="application-name" content="Agenda Gama">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agenda Gama">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <title>Agenda Gama | Nova Disciplina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260716-10">
</head>
<body data-page="disciplinas" data-roles="administrador,funcionarios">
  <div id="app-shell"></div>
  <template id="page-template">
    <section class="page-hero">
      <div>
        <span class="pill">Organização</span>
        <h1>Cadastro de disciplinas</h1>
        <p>Cadastre as matérias usadas por professores, atividades, notas e boletins.</p>
      </div>
      <div class="page-actions">
        <article class="info-card">
          <span>Total de disciplinas</span>
          <strong id="total-disciplinas">00</strong>
        </article>
        <a class="btn btn-secondary" href="disciplinas.html">Ver disciplinas cadastradas</a>
      </div>
    </section>
    <section>
      <article class="panel">
        <div class="section-heading"><div><h2>Nova matéria</h2><p>Informe o nome da matéria. Os demais campos são opcionais.</p></div></div>
        <form id="disciplinas-form" class="form-grid">
          <label class="field full"><span>Nome da matéria</span><input name="nome" placeholder="Ex.: Matemática" maxlength="100" autocomplete="off" required></label>
          <label class="field"><span>Carga horária <small>(opcional)</small></span><input name="carga" placeholder="Ex.: 4 aulas por semana" maxlength="80"></label>
          <label class="field"><span>Etapa <small>(opcional)</small></span><select name="etapa"><option value="">Todas as etapas</option><option>Educação Infantil</option><option>Ensino Fundamental</option><option>Ensino Médio</option></select></label>
          <p id="disciplinas-feedback" class="feedback full" role="status" aria-live="polite" hidden></p>
          <button type="submit" class="btn btn-primary full">Salvar matéria</button>
        </form>
      </article>
    </section>
  </template>
  <script src="../../assets/js/config.js?v=20260415-4"></script>
  <script src="../../assets/js/supabase.js?v=20260813-1"></script>
  <script src="../../assets/js/auth.js?v=20260813-1"></script>
  <script src="../../assets/js/app.js?v=20260813-1"></script>
  <script src="../../assets/js/data-store.js?v=20260619-4"></script>
  <script src="../../assets/js/forms.js?v=20260727-1"></script>
  <script>
    window.AgendaGamaApp.mountShell();
    window.AgendaGamaForms.mountCrud({
      storageKey: "disciplinas",
      formId: "disciplinas-form",
      totalId: "total-disciplinas",
      feedbackId: "disciplinas-feedback",
      redirectAfterSubmit: "disciplinas.html",
      cancelRedirect: "disciplinas.html",
      columns: [{ key: "nome" }, { key: "carga" }, { key: "etapa", type: "tag" }],
      seedData: [],
      beforeSave: function ({ data, editingId, items }) {
        const nome = String(data.nome || "").trim();
        if (!nome) return { error: "Informe o nome da matéria." };

        const normalizar = function (value) {
          return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
        };
        const duplicada = items.some(function (item) {
          return item.id !== editingId && normalizar(item.nome) === normalizar(nome);
        });
        if (duplicada) return { error: "Essa matéria já está cadastrada." };

        return {
          data: {
            ...data,
            nome: nome,
            carga: String(data.carga || "").trim() || "Não informada",
            etapa: String(data.etapa || "").trim() || "Todas as etapas"
          }
        };
      }
    });
  </script>
  <script src="/assets/js/pwa.js?v=20260716-1"></script>
</body>
</html>
