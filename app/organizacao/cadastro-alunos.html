<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b2147">
  <meta name="application-name" content="Agenda Gama">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agenda Gama">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <title>Agenda Gama | Novo Aluno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260821-1">
</head>
<body data-page="alunos" data-roles="administrador,funcionarios">
  <div id="app-shell"></div>
  <template id="page-template">
    <section class="page-hero">
      <div>
        <span class="pill">Organização</span>
        <h1>Cadastro de alunos</h1>
        <p>Cadastre ou edite alunos em uma página separada da listagem.</p>
      </div>
      <div class="page-actions">
        <article class="info-card">
          <span>Total de alunos</span>
          <strong id="total-alunos">00</strong>
        </article>
        <a class="btn btn-secondary" href="alunos.html">Ver alunos cadastrados</a>
      </div>
    </section>
    <section>
      <article class="panel">
        <div class="section-heading"><div><h2>Novo aluno</h2><p>Cadastre matricula e vincule o estudante a uma turma ja cadastrada.</p></div></div>
        <form id="alunos-form" class="form-grid">
          <label class="field"><span>Nome completo</span><input name="nome" placeholder="Ex.: Ana Clara Silva" required></label>
          <label class="field"><span>Matrícula</span><input name="matricula" placeholder="Ex.: 20260045" required></label>
          <label class="field full">
            <span>Turma</span>
            <input id="aluno-turma-search" name="turma_busca" list="aluno-turmas-list" placeholder="Digite o nome da turma cadastrada" autocomplete="off" required>
            <datalist id="aluno-turmas-list"></datalist>
            <input type="hidden" name="turma">
            <p class="muted">Digite o inicio do nome da turma e selecione uma opcao ja cadastrada.</p>
            <div id="aluno-turma-selected" class="hint-box" hidden></div>
          </label>
          <label class="field">
            <span>Turno da turma</span>
            <input id="aluno-turno-display" placeholder="Selecione uma turma" readonly>
            <input type="hidden" name="turno">
          </label>
          <fieldset class="student-health-form-card full">
            <legend>Atenção à saúde do aluno</legend>
            <p class="muted">Informação privada, visível somente para Administradores e Funcionários.</p>
            <label class="field">
              <span>Tipo de atenção</span>
              <select id="aluno-health-category">
                <option value="">Nenhuma observação</option>
                <option value="food_restriction">Restrição alimentar</option>
                <option value="health_condition">Problema ou condição de saúde</option>
                <option value="other">Outra atenção importante</option>
              </select>
            </label>
            <div id="aluno-health-details" class="student-health-form-details" hidden>
              <label class="field full">
                <span>Observação importante</span>
                <textarea id="aluno-health-observation" rows="4" placeholder="Ex.: alergia grave a amendoim; não oferecer alimentos com traços."></textarea>
              </label>
              <label class="field full">
                <span>Laudo ou documento</span>
                <input id="aluno-health-document" type="file" accept="application/pdf,image/jpeg,image/png,image/webp">
                <small>PDF, JPG, PNG ou WEBP, com até 10 MB.</small>
              </label>
              <div id="aluno-health-existing-document" class="student-health-document" hidden>
                <div>
                  <strong>Laudo cadastrado</strong>
                  <small id="aluno-health-document-name"></small>
                </div>
                <a id="aluno-health-document-link" class="btn btn-secondary btn-sm" target="_blank" rel="noopener">Visualizar</a>
                <label class="student-health-remove-document">
                  <input id="aluno-health-remove-document" type="checkbox">
                  <span>Remover este laudo</span>
                </label>
              </div>
            </div>
          </fieldset>
          <button type="submit" class="btn btn-primary full">Salvar aluno</button>
          <div id="aluno-feedback" class="feedback full" aria-live="polite"></div>
        </form>
      </article>
    </section>
  </template>
  <script src="../../assets/js/config.js?v=20260416-9"></script>
  <script src="../../assets/js/supabase.js?v=20260813-1"></script>
  <script src="../../assets/js/auth.js?v=20260813-1"></script>
  <script src="../../assets/js/app.js?v=20260813-1"></script>
  <script src="../../assets/js/data-store.js?v=20260821-1"></script>
  <script src="../../assets/js/student-health.js?v=20260821-1"></script>
  <script src="../../assets/js/forms.js?v=20260716-1"></script>
  <script>
    window.AgendaGamaApp.mountShell();

    const TURMAS_SEED = [
      { id: "turma-demo-1", nome: "1o Ano A", turno: "Manha", sala: "Sala 01", ano: "2026" },
      { id: "turma-demo-2", nome: "5o Ano B", turno: "Tarde", sala: "Sala 08", ano: "2026" }
    ];

    let turmasCache = [];
    let healthRecordsCache = [];
    let currentHealthRecord = null;

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\uFFFD/g, "")
        .trim()
        .toLowerCase();
    }

    function findTurmaByName(nome) {
      const normalizedName = normalizeText(nome);
      return turmasCache.find((turma) => normalizeText(turma.nome) === normalizedName) || null;
    }

    function resolveTurma(value) {
      const exactMatch = findTurmaByName(value);
      if (exactMatch) {
        return exactMatch;
      }

      const normalizedSearch = normalizeText(value);
      if (!normalizedSearch) {
        return null;
      }

      const matchingTurmas = turmasCache.filter((item) => normalizeText(item.nome).startsWith(normalizedSearch));
      return matchingTurmas.length === 1 ? matchingTurmas[0] : null;
    }

    function renderSelectedTurma(turma) {
      const turmaField = document.getElementById("aluno-turma-search");
      const turnoDisplay = document.getElementById("aluno-turno-display");
      const selectedBox = document.getElementById("aluno-turma-selected");
      const hiddenTurma = document.querySelector('#alunos-form input[name="turma"]');
      const hiddenTurno = document.querySelector('#alunos-form input[name="turno"]');

      if (!turma) {
        if (hiddenTurma) hiddenTurma.value = "";
        if (hiddenTurno) hiddenTurno.value = "";
        if (turnoDisplay) turnoDisplay.value = "";
        if (selectedBox) {
          selectedBox.hidden = true;
          selectedBox.innerHTML = "";
        }
        if (turmaField) {
          turmaField.setCustomValidity("Selecione uma turma ja cadastrada na lista.");
        }
        return;
      }

      if (hiddenTurma) hiddenTurma.value = turma.nome;
      if (hiddenTurno) hiddenTurno.value = turma.turno || "";
      if (turnoDisplay) turnoDisplay.value = turma.turno || "";
      if (turmaField) {
        turmaField.value = turma.nome;
        turmaField.setCustomValidity("");
      }
      if (selectedBox) {
        selectedBox.hidden = false;
        selectedBox.innerHTML = `
          <p><strong>Turma selecionada:</strong> ${turma.nome}</p>
          <p><strong>Turno:</strong> ${turma.turno || "-"} | <strong>Sala:</strong> ${turma.sala || "-"} | <strong>Ano:</strong> ${turma.ano || "-"}</p>
        `;
      }
    }

    function toggleHealthDetails() {
      const category = document.getElementById("aluno-health-category")?.value || "";
      const details = document.getElementById("aluno-health-details");
      if (details) details.hidden = !category;
    }

    function resetHealthFields() {
      currentHealthRecord = null;
      const category = document.getElementById("aluno-health-category");
      const observation = document.getElementById("aluno-health-observation");
      const file = document.getElementById("aluno-health-document");
      const removeDocument = document.getElementById("aluno-health-remove-document");
      const existingDocument = document.getElementById("aluno-health-existing-document");
      const documentLink = document.getElementById("aluno-health-document-link");
      if (category) category.value = "";
      if (observation) observation.value = "";
      if (file) file.value = "";
      if (removeDocument) removeDocument.checked = false;
      if (existingDocument) existingDocument.hidden = true;
      if (documentLink) documentLink.removeAttribute("href");
      toggleHealthDetails();
    }

    async function populateHealthFields(studentId) {
      resetHealthFields();
      currentHealthRecord = healthRecordsCache.find(function (record) {
        return String(record.studentId) === String(studentId) && record.active !== false;
      }) || null;
      if (!currentHealthRecord) return;

      const recordId = currentHealthRecord.id;
      document.getElementById("aluno-health-category").value = currentHealthRecord.category || "other";
      document.getElementById("aluno-health-observation").value = currentHealthRecord.observation || "";
      toggleHealthDetails();

      if (!currentHealthRecord.documentPath) return;
      const documentBox = document.getElementById("aluno-health-existing-document");
      const documentName = document.getElementById("aluno-health-document-name");
      const documentLink = document.getElementById("aluno-health-document-link");
      documentBox.hidden = false;
      documentName.textContent = currentHealthRecord.documentName || "Documento anexado";
      documentLink.removeAttribute("href");
      documentLink.textContent = "Preparando...";

      try {
        const signedUrl = await window.AgendaGamaStudentHealth.createSignedDocumentUrl(currentHealthRecord.documentPath);
        if (currentHealthRecord?.id !== recordId) return;
        documentLink.href = signedUrl;
        documentLink.textContent = "Visualizar";
      } catch (error) {
        documentLink.textContent = "Indisponível";
        documentLink.removeAttribute("href");
      }
    }

    function collectHealthMeta() {
      const category = document.getElementById("aluno-health-category")?.value || "";
      const observation = document.getElementById("aluno-health-observation")?.value.trim() || "";
      const file = document.getElementById("aluno-health-document")?.files?.[0] || null;
      const removeExistingDocument = Boolean(document.getElementById("aluno-health-remove-document")?.checked);
      return { category, observation, file, removeExistingDocument, existingRecord: currentHealthRecord };
    }

    async function carregarHealthRecords() {
      healthRecordsCache = await window.AgendaGamaStudentHealth.listRecords();
      document.getElementById("aluno-health-category")?.addEventListener("change", toggleHealthDetails);
      document.getElementById("aluno-health-document")?.addEventListener("change", function (event) {
        const file = event.target.files?.[0] || null;
        try {
          window.AgendaGamaStudentHealth.validateFile(file);
          event.target.setCustomValidity("");
        } catch (error) {
          event.target.value = "";
          event.target.setCustomValidity(error.message || "Arquivo inválido.");
          event.target.reportValidity();
          event.target.setCustomValidity("");
        }
      });
    }

    async function carregarTurmas() {
      const turmaField = document.getElementById("aluno-turma-search");
      const datalist = document.getElementById("aluno-turmas-list");

      if (!turmaField || !datalist) {
        window.addEventListener("agenda-shell-ready", function handleReady() {
          window.removeEventListener("agenda-shell-ready", handleReady);
          carregarTurmas();
        });
        return;
      }

      turmasCache = await window.AgendaGamaDataStore.list("turmas", TURMAS_SEED);
      datalist.innerHTML = turmasCache.map((turma) => (
        `<option value="${turma.nome}">${turma.turno || ""} | ${turma.ano || ""}</option>`
      )).join("");

      turmaField.addEventListener("input", function () {
        const turma = resolveTurma(turmaField.value);
        if (turma) {
          renderSelectedTurma(turma);
          return;
        }

        renderSelectedTurma(null);
      });

      turmaField.addEventListener("change", function () {
        renderSelectedTurma(resolveTurma(turmaField.value));
      });
    }

    async function iniciarCadastroAluno() {
      await Promise.all([carregarTurmas(), carregarHealthRecords()]);

      await window.AgendaGamaForms.mountCrud({
        storageKey: "alunos",
        formId: "alunos-form",
        totalId: "total-alunos",
        feedbackId: "aluno-feedback",
        redirectAfterSubmit: "alunos.html",
        cancelRedirect: "alunos.html",
        columns: [{ key: "nome" }, { key: "matricula" }, { key: "turma" }, { key: "turno", type: "tag" }],
        beforeSave: async function ({ data }) {
          const turma = resolveTurma(data.turma_busca || data.turma);
          if (!turma) {
            return { error: "Selecione uma turma ja cadastrada para vincular o aluno." };
          }

          const healthMeta = collectHealthMeta();
          if (healthMeta.category && !healthMeta.observation) {
            return { error: "Escreva a observação importante sobre a saúde do aluno." };
          }
          try {
            window.AgendaGamaStudentHealth.validateFile(healthMeta.file);
          } catch (error) {
            return { error: error.message || "O laudo selecionado é inválido." };
          }

          renderSelectedTurma(turma);
          const { turma_busca, ...cleanData } = data;

          return {
            data: {
              ...cleanData,
              turma: turma.nome,
              turno: turma.turno || ""
            },
            meta: { health: healthMeta }
          };
        },
        afterSave: async function ({ item, meta }) {
          await window.AgendaGamaStudentHealth.syncRecord({
            studentId: item.id,
            ...(meta?.health || {})
          });
        },
        populateForm: function (form, item) {
          form.elements.namedItem("nome").value = item.nome || "";
          form.elements.namedItem("matricula").value = item.matricula || "";

          const turma = findTurmaByName(item.turma);
          if (turma) {
            renderSelectedTurma(turma);
          } else {
            document.getElementById("aluno-turma-search").value = item.turma || "";
            document.getElementById("aluno-turno-display").value = item.turno || "";
            form.elements.namedItem("turma").value = item.turma || "";
            form.elements.namedItem("turno").value = item.turno || "";
            document.getElementById("aluno-turma-search").setCustomValidity("");
          }

          void populateHealthFields(item.id);
        },
        afterSubmit: function () {
          renderSelectedTurma(null);
          resetHealthFields();
        },
        seedData: [
          { nome: "Ana Clara Silva", matricula: "20260045", turma: "5o Ano B", turno: "Tarde" },
          { nome: "Pedro Henrique", matricula: "20260051", turma: "1o Ano A", turno: "Manha" }
        ]
      });
    }

    iniciarCadastroAluno().catch(function (error) {
      const feedback = document.getElementById("aluno-feedback");
      if (!feedback) return;
      feedback.hidden = false;
      feedback.className = "feedback error";
      feedback.textContent = error?.message || "Não foi possível carregar as informações de saúde dos alunos.";
    });
  </script>
  <script src="/assets/js/pwa.js?v=20260716-1"></script>
</body>
</html>
