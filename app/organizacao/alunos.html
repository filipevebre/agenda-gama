<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b2147">
  <meta name="application-name" content="Agenda Gama">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agenda Gama">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <title>Agenda Gama | Alunos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css?v=20260821-2">
</head>
<body data-page="alunos" data-roles="administrador,funcionarios">
  <div id="app-shell"></div>
  <template id="page-template">
    <section class="page-hero">
      <div>
        <span class="pill">Organizacao</span>
        <h1>Alunos cadastrados</h1>
        <p>Pesquise e gerencie os estudantes cadastrados.</p>
      </div>
      <div class="page-actions">
        <article class="info-card">
          <span>Total de alunos</span>
          <strong id="total-alunos">00</strong>
        </article>
        <a class="btn btn-primary" href="cadastro-alunos.html">Novo aluno</a>
      </div>
    </section>
    <section>
      <article class="table-card">
        <h3>Alunos cadastrados</h3>
        <p>Matriculas, turma e responsaveis vinculados.</p>
        <label class="field search-box">
          <span>Pesquisar aluno</span>
          <input id="alunos-search" placeholder="Busque por nome, matricula, turma ou turno">
        </label>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Aluno</th>
                <th>Matricula</th>
                <th>Turma</th>
                <th>Turno</th>
                <th>Atenção</th>
                <th>Responsaveis</th>
              </tr>
            </thead>
            <tbody id="alunos-table-body"></tbody>
          </table>
        </div>
        <p id="alunos-empty" class="empty-state" hidden>Nenhum aluno cadastrado ainda.</p>
      </article>
    </section>
  </template>
  <script src="../../assets/js/config.js?v=20260415-4"></script>
  <script src="../../assets/js/supabase.js?v=20260813-1"></script>
  <script src="../../assets/js/auth.js?v=20260813-1"></script>
  <script src="../../assets/js/app.js?v=20260813-1"></script>
  <script src="../../assets/js/data-store.js?v=20260821-2"></script>
  <script src="../../assets/js/student-health.js?v=20260821-2"></script>
  <script src="../../assets/js/forms.js?v=20260720-1"></script>
  <script>
    window.AgendaGamaApp.mountShell();

    const RESPONSAVEIS_SEED = [];
    let responsaveisCache = [];
    let healthRecordsCache = [];

    function normalizeAlunoText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
    }

    function getResponsaveisVinculados(aluno) {
      return responsaveisCache.filter(function (responsavel) {
        if (responsavel.aluno_id && aluno.id) {
          return responsavel.aluno_id === aluno.id;
        }

        return normalizeAlunoText(responsavel.aluno) === normalizeAlunoText(aluno.nome);
      });
    }

    function renderResponsaveisVinculados(aluno) {
      const responsaveis = getResponsaveisVinculados(aluno);

      if (!responsaveis.length) {
        return '<span class="muted">Sem responsaveis vinculados</span>';
      }

      return `
        <div class="inline-tags">
          ${responsaveis.map(function (responsavel) {
            return `<span class="tag">${responsavel.nome}</span>`;
          }).join("")}
        </div>
      `;
    }

    function renderHealthAlert(aluno) {
      const record = healthRecordsCache.find(function (item) {
        return String(item.studentId) === String(aluno.id) && item.active !== false;
      });
      if (!record) return '<span class="muted">Sem observação</span>';
      const category = window.AgendaGamaStudentHealth.categoryLabel(record.category);
      const condition = String(record.conditionName || "Não especificado")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
      return `<span class="status-badge status-pendente student-health-table-badge"><strong>${category}:</strong> ${condition}</span>`;
    }

    async function iniciarPaginaAlunos() {
      const results = await Promise.all([
        window.AgendaGamaDataStore.list("responsaveis", RESPONSAVEIS_SEED),
        window.AgendaGamaStudentHealth.listRecords()
      ]);
      responsaveisCache = results[0] || [];
      healthRecordsCache = results[1] || [];

      window.AgendaGamaForms.mountCrud({
        storageKey: "alunos",
        tableBodyId: "alunos-table-body",
        emptyStateId: "alunos-empty",
        totalId: "total-alunos",
        searchInputId: "alunos-search",
        searchKeys: ["nome", "matricula", "turma", "turno"],
        editPageUrl: "cadastro-alunos.html",
        viewPageUrl: "../perfil-aluno.html",
        emptyMessage: "Nenhum aluno cadastrado ainda.",
        columns: [
          { key: "nome" },
          { key: "matricula" },
          { key: "turma" },
          { key: "turno", type: "tag" },
          {
            key: "health",
            render: function (_, item) {
              return renderHealthAlert(item);
            }
          },
          {
            key: "responsaveis",
            render: function (_, item) {
              return renderResponsaveisVinculados(item);
            }
          }
        ],
        afterDelete: async function ({ item }) {
          const healthRecord = healthRecordsCache.find(function (record) {
            return String(record.studentId) === String(item.id);
          });
          if (healthRecord) {
            await window.AgendaGamaStudentHealth.removeRecord(healthRecord);
          }
        },
        seedData: [
          { nome: "Ana Clara Silva", matricula: "20260045", turma: "5o Ano B", turno: "Tarde" },
          { nome: "Pedro Henrique", matricula: "20260051", turma: "1o Ano A", turno: "Manha" }
        ]
      });
    }

    iniciarPaginaAlunos();
  </script>
  <script src="/assets/js/pwa.js?v=20260716-1"></script>
</body>
</html>
