name: Validar aplicativo iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/prepare-native.mjs"

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar aplicativo iOS
        run: npm run ios:sync

      - name: Compilar para o simulador
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
